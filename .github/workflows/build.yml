name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Archive
        run: |
          mkdir -p src_temp
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip -d src_temp
          else
            tar -xvf aistudio_* -C src_temp 2>/dev/null || unzip -o aistudio_* -d src_temp 2>/dev/null || true
          fi
          find src_temp -name "build.gradle*" -execdir cp -r . "$GITHUB_WORKSPACE" \; 2>/dev/null || true

      - name: Add Call Permissions & Intent Handling
        run: |
          # 1. Manifest clean & Call / Contact Permissions
          find . -name "AndroidManifest.xml" -exec sed -i '/data_extraction_rules/d' {} +
          find . -name "AndroidManifest.xml" -exec sed -i '/backup_rules/d' {} +
          find . -name "AndroidManifest.xml" -exec sed -i 's/android:icon="[^"]*"/android:icon="@android:drawable\/ic_dialog_info"/g' {} +
          find . -name "AndroidManifest.xml" -exec sed -i 's/android:roundIcon="[^"]*"/android:roundIcon="@android:drawable\/ic_dialog_info"/g' {} +

          find . -name "AndroidManifest.xml" | while read file; do
            if ! grep -q "android.permission.CALL_PHONE" "$file"; then
              sed -i 's|<application|<uses-permission android:name="android.permission.CALL_PHONE" />\n    <uses-permission android:name="android.permission.READ_CONTACTS" />\n    <application|g' "$file"
            fi
            if ! grep -q "<queries>" "$file"; then
              sed -i 's|</manifest>|    <queries>\n        <intent>\n            <action android:name="android.intent.action.DIAL" />\n        </intent>\n        <intent>\n            <action android:name="android.intent.action.CALL" />\n        </intent>\n    </queries>\n</manifest>|g' "$file"
            fi
          done

          # 2. Dependencies
          find . -name "build.gradle.kts" | while read file; do
            if grep -q "dependencies {" "$file"; then
              sed -i '/dependencies {/a \    implementation("androidx.constraintlayout:constraintlayout:2.1.4")\n    implementation("com.google.android.material:material:1.11.0")' "$file"
            fi
          done
          find . -name "build.gradle" ! -name "*.kts" | while read file; do
            if grep -q "dependencies {" "$file"; then
              sed -i '/dependencies {/a \    implementation "androidx.constraintlayout:constraintlayout:2.1.4"\n    implementation "com.google.android.material:material:1.11.0"' "$file"
            fi
          done

          # 3. Layout Typo fix
          find . -name "activity_main.xml" | while read file; do
            if ! grep -q "xmlns:app" "$file"; then
              sed -i 's|xmlns:android="http://schemas.android.com/apk/res/android"|xmlns:android="http://schemas.android.com/apk/res/android"\n    xmlns:app="http://schemas.android.com/apk/res-auto"|g' "$file"
            fi
            sed -i 's/layout_constraintTopToTopOf/layout_constraintTop_toTopOf/g' "$file"
            sed -i 's/layout_constraintTopToBottomOf/layout_constraintTop_toBottomOf/g' "$file"
            sed -i 's/layout_constraintBottomToTopOf/layout_constraintBottom_toTopOf/g' "$file"
            sed -i 's/layout_constraintBottomToBottomOf/layout_constraintBottom_toBottomOf/g' "$file"
            sed -i 's/layout_constraintStartToStartOf/layout_constraintStart_toStartOf/g' "$file"
            sed -i 's/layout_constraintStartToEndOf/layout_constraintStart_toEndOf/g' "$file"
            sed -i 's/layout_constraintEndToEndOf/layout_constraintEnd_toEndOf/g' "$file"
            sed -i 's/layout_constraintEndToStartOf/layout_constraintEnd_toStartOf/g' "$file"
          done

          # 4. Fix 404: Replace 'models/gemini-*' with bare model names
          find . -type f \( -name "*.kt" -o -name "*.java" \) | while read file; do
            sed -i 's/"models\/gemini-1.5-flash"/"gemini-1.5-flash"/g' "$file"
            sed -i 's/"models\/gemini-1.5-flash-latest"/"gemini-1.5-flash"/g' "$file"
            sed -i 's/"models\/gemini-pro"/"gemini-1.5-flash"/g' "$file"
            sed -i 's/"gemini-pro"/"gemini-1.5-flash"/g' "$file"
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Compatible Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Wrapper with 8.4
        run: gradle wrapper --gradle-version 8.4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Myra-Voice-Assistant-APK
          path: "**/build/outputs/apk/debug/*.apk"
          

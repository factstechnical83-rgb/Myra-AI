name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Archive
        run: |
          mkdir -p src_temp
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip -d src_temp
          else
            tar -xvf aistudio_* -C src_temp 2>/dev/null || unzip -o aistudio_* -d src_temp 2>/dev/null || true
          fi
          find src_temp -name "build.gradle*" -execdir cp -r . "$GITHUB_WORKSPACE" \; 2>/dev/null || true

      - name: Fix Missing Manifest Resources & Dependencies
        run: |
          # 1. Clean Manifest missing attributes
          find . -name "AndroidManifest.xml" -exec sed -i '/data_extraction_rules/d' {} +
          find . -name "AndroidManifest.xml" -exec sed -i '/backup_rules/d' {} +
          find . -name "AndroidManifest.xml" -exec sed -i 's/android:icon="[^"]*"/android:icon="@android:drawable\/ic_dialog_info"/g' {} +
          find . -name "AndroidManifest.xml" -exec sed -i 's/android:roundIcon="[^"]*"/android:roundIcon="@android:drawable\/ic_dialog_info"/g' {} +

          # 2. Add dependencies with Kotlin DSL syntax
          find . -name "build.gradle.kts" | while read file; do
            if grep -q "dependencies {" "$file"; then
              sed -i '/dependencies {/a \    implementation("androidx.constraintlayout:constraintlayout:2.1.4")\n    implementation("com.google.android.material:material:1.11.0")' "$file"
            fi
          done

          # Fallback for Groovy syntax
          find . -name "build.gradle" ! -name "*.kts" | while read file; do
            if grep -q "dependencies {" "$file"; then
              sed -i '/dependencies {/a \    implementation "androidx.constraintlayout:constraintlayout:2.1.4"\n    implementation "com.google.android.material:material:1.11.0"' "$file"
            fi
          done

          # 3. Inject full namespaces into root tag of layout files
          find . -name "activity_main.xml" | while read file; do
            sed -i 's|<androidx.constraintlayout.widget.ConstraintLayout|<androidx.constraintlayout.widget.ConstraintLayout xmlns:android="http://schemas.android.com/apk/res/android" xmlns:app="http://schemas.android.com/apk/res-auto" xmlns:tools="http://schemas.android.com/tools"|g' "$file"
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Compatible Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Wrapper with 8.4
        run: gradle wrapper --gradle-version 8.4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Myra-Voice-Assistant-APK
          path: "**/build/outputs/apk/debug/*.apk"
          

name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Archive
        run: |
          mkdir -p src_temp
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip -d src_temp
          else
            tar -xvf aistudio_* -C src_temp 2>/dev/null || unzip -o aistudio_* -d src_temp 2>/dev/null || true
          fi
          # Copy everything into project root
          find src_temp -name "build.gradle*" -execdir cp -r . "$GITHUB_WORKSPACE" \; 2>/dev/null || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper
        run: gradle wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Myra-Voice-Assistant-APK
          path: "**/build/outputs/apk/debug/*.apk"
          

name: Build Android APK from Zip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project Zip
        run: |
          unzip -o *.zip -d extracted_temp
          if [ -d "extracted_temp/myra-voice-assistant" ]; then
            cp -r extracted_temp/myra-voice-assistant/* .
          else
            cp -r extracted_temp/*/* . 2>/dev/null || cp -r extracted_temp/* .
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Myra-Voice-Assistant-APK
          path: "**/build/outputs/apk/debug/*.apk"
          

name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Environment File
        run: |
          mkdir -p extracted_temp
          # Extract whatever archive exists
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip -d extracted_temp
          elif ls *.tar.gz 1> /dev/null 2>&1 || ls aistudio_* 1> /dev/null 2>&1; then
            tar -xvf aistudio_* -C extracted_temp || unzip -o aistudio_* -d extracted_temp || true
          fi
          
          # Move files to root
          find extracted_temp -name "gradlew" -execdir cp -r . "$GITHUB_WORKSPACE" \; || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Myra-Voice-Assistant-APK
          path: "**/build/outputs/apk/debug/*.apk"
          
